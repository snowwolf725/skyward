[device]
codename = "waffle"
brand = "OnePlus"
model = "OnePlus 12"
ab = true
soc = { hans = "第三代骁龙®8移动平台", hant = "Snapdragon® 8 Gen 3 行動平台", en = "Snapdragon® 8 Gen 3 Mobile Platform" }
os_version_prop = "ro.build.display.id"

[display]
# The panel's own mode, persist.sys.miui_default_resolution in the odm
# partition's build.prop and the n1 panel's mode in the device tree:
# 1440 by 3200. persist.sys.miui_resolution gives the lower mode the system
# starts in, 1080 by 2400 at 420, as the 13 Ultra's does; the density is
# that one's, at the panel's own width, as the 13 Ultra's is.
width = 1440
height = 3168
density = 640
#diagonal = 6.83
#corner_radius = 130

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
# /proc/cmdline: touch_panel0=0:synaptics-s3910: → oplus_bsp_tp_hbp_syna_s3910
load = ["oplus_bsp_tp_common", "oplus_bsp_tp_notify", "oplus_bsp_tp_hbp_syna_s3910"]

[touch]
writes = []
#writes = [{ path = "/sys/class/touch/touch_dev/enable_touch_raw", value = "0" }]

[firmware]
partition = "modem"

# OPPO TEE key 
# persist（qcc/secnvm/tam/hexlp）
[partitions]
mounted = ["persist"]

[logd]
libraries = ["/mnt/system/system/lib64/libsysutils.so", "/mnt/system/system/lib64/libcap.so"]

# qseecomd、hlosminkdaemon、keymint、gatekeeper。
[[service]]
path = "/vendor/bin/hw/android.hardware.security.keymint-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_service = "android.hardware.security.keymint.IKeyMintDevice/default"
registers = [
    "android.hardware.security.keymint.IRemotelyProvisionedComponent/default",
    "android.hardware.security.secureclock.ISecureClock/default",
    "android.hardware.security.sharedsecret.ISharedSecret/default",
]
user = "system"
groups = ["system", "drmrpc"]

[[service]]
path = "/vendor/bin/hw/android.hardware.gatekeeper-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_service = "android.hardware.gatekeeper.IGatekeeper/default"
user = "system"
groups = ["system"]

[[service]]
path = "/vendor/bin/hlosminkdaemon"
libraries = ["/system/lib64", "/vendor/lib64"]
user = "system"
groups = ["system", "wakelock"]
capabilities = ["WAKE_ALARM", "BLOCK_SUSPEND"]

[[service]]
path = "/vendor/bin/qseecomd"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_property = "vendor.sys.listeners.registered"
user = "root"
groups = ["root", "drmrpc"]

[[service]]
path = "/vendor/bin/hw/android.hardware.boot-service.qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_service = "android.hardware.boot.IBootControl/default"
user = "root"
groups = ["root"]

# WLAN: the kiwi node in the device tree, driven by qca_cld3_kiwi_v2, the
# one WLAN driver the phone's own modules.blocklist leaves of those its
# modules.load lists. Its cfg80211 asks for rfkill, one of the kernel's own
# modules in system_dlkm, as the 17 Ultra's does. Its recovery covers the
# vendor partition's firmware folder with the modem's, as the 13 Ultra's
# does, so the settings and the MAC address are given to the loader again:
# the settings from the vendor partition, the address from where the
# vendor's link points in persist. wpa_supplicant runs on the recovery's
# own libraries before the vendor partition's, as on the 17 Ultra.
[wlan]
modules = ["rfkill", "qca_cld3_kiwi_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
firmware = [
    { name = "wlan/qca_cld/kiwi_v2/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/kiwi_v2/WCNSS_qcom_cfg.ini" },
    { name = "wlan/qca_cld/kiwi_v2/wlan_mac.bin", partition = "persist", path = "wlan/wlan_mac.bin" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# The update server the stock updater of the Chinese system asks.
[update]
server = "https://update.miui.com/updates/miotaV3.php"

# The stock build the recovery is made on: the Chinese system's
# OS3.0.308.0, whose full update package on the phone maker's own download
# server holds the recovery partition the recovery is built on top of.
#[stock]
#version = "CPH2583_16.0.3.500(EX01)"
#package = "https://android.googleapis.com/packages/ota-api/package/5dbd9e29f6f38d4e572830c1739c94d7581daa7b.zip"
#recovery = "16a206770d6920d34d8eb5b571fec6ff60757e55629cd387d420695ecf0bc7c0"

# qcom-hv-haptics (qcom,hv-haptics in its dtbo), whose driver says the
# motor's resonant frequency as the 17 Ultra's does; the click is made from
# samples at that frequency, and the strengths are the 17 Ultra's. Neither
# is yet tried on this phone's motor.
[haptics]
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
strength = { lightest = 0.25, strongest = 0.75 }

[backup]
efs = ["modemst1", "modemst2", "fsg", "fsc", "persist", "oplusstanvbk_a"]
data_skipped = [
    "vendor/tzstorage",
    "vendor/qtee",
    "vendor/goodix",
    "vendor/fingerprint",
    "vendor/fpdata",
]

[wipe]
logs = [
    "/data/vendor/oplusreserve",
    "/data/vendor/diag",
    "/data/vendor/tombstones",
    "/data/vendor/ramdump",
]
