# Mod: SnowWolf725 
name: Build for OnePlus 12 (CPH2573)

on:
  workflow_dispatch:
    inputs:
      stock_asset:
        description: Release file name
        required: true
        default: recovery.img

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build recovery for op12
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build the recovery service for the phone
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward

      - name: Build the packer
        run: cargo build --locked --release -p skyward-pack

      # 关键诊断：stock ramdisk 里到底有没有打包器硬依赖的
      # system/bin/recovery 和 prop.default。没有就得改 Rust 代码。
      - name: Inspect the stock ramdisk
        run: |
          set +e
          target/release/skyward-pack list stock/recovery_stock.img > ramdisk.txt 2> list.err
          echo "exit=$?"
          echo "===== 前 60 条 ====="
          head -60 ramdisk.txt
          echo "===== 关键路径 ====="
          for p in system/bin/recovery system/bin/adbd prop.default system/bin/sh init; do
            if grep -qE "(^|[[:space:]])${p}$" ramdisk.txt; then echo "OK   $p"; else echo "MISS $p"; fi
          done
          echo "===== system/ 下 ====="
          grep -E "system/" ramdisk.txt | head -40
          echo "===== 行数 ====="
          cat ramdisk.txt | wc -l
          cat list.err

      - name: Pack the recovery
        env:
          ASSET: ${{ inputs.stock_asset }}
        run: |
          target/release/skyward-pack recovery \
            --stock "stock/recovery_stock.img" \
            --binary target/aarch64-linux-android/release/skyward \
            --system-init target/system-init/aarch64-linux-android/release/system-init \
            --config devices/waffle.toml \
            --font resources/fonts/MiSansVF.ttf \
            --mono resources/fonts/KirkMono-Regular.ttf \
            --mono-license resources/fonts/KirkMono-OFL.txt \
            --out skyward-op12.img
          ls -l skyward-op12.img
          sha256sum skyward-op12.img
          zip -9 skyward-op12.zip skyward-op12.img
          sha256sum skyward-op12.zip

      - uses: actions/upload-artifact@v7
        with:
          name: skyward-op12
          path: skyward-op12.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
